<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso BBVA</title>

    <link rel="stylesheet" href="style_login.css">

    <link rel="icon" href="Resources/Icons/logoBBVA_Pestaña.png" type="image/png">
</head>

<body>

    <header class="login-header">

        <div class="login-header-container">

            <div class="login-header-left">

                <a href="#" class="login-logo">
                    <img src="https://static.wikia.nocookie.net/logopedia/images/f/ff/BBVA_2025.svg/revision/latest/scale-to-width-down/250?cb=20250703225525&path-prefix=es" alt="BBVA">
                </a>

                <nav class="login-nav">

                    <a href="#" class="active">
                        Persona
                    </a>

                    <a href="#">
                        Empresa
                    </a>

                </nav>

            </div>

            <div class="login-header-right">

                <button class="btn-close-login">

                    <span>Cerrar</span>

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="26"
                        height="26"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>

                    </svg>

                </button>

            </div>

        </div>

    </header>

    
</body>

<script src="script_login.js"></script>

</html>
